version: "3"

vars:
  APP_NAME: "miku-chrono"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: windows:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: windows:package

  run:
    summary: Runs the application
    cmds:
      - task: windows:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs Go vet + tests, then the frontend lint + tests
    cmds:
      - go vet ./...
      - go test ./...
      - task: fe-test

  fe-test:
    summary: Runs the frontend lint and test suites
    dir: frontend
    cmds:
      - pnpm lint
      - pnpm test

  lint:
    summary: Runs golangci-lint over the Go sources (requires golangci-lint)
    cmds:
      - golangci-lint run
