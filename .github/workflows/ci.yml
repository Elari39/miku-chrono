name: CI

on:
  push:
    branches: [main]
  pull_request:

# windows-latest because the services package carries //go:build windows
# files (Win32 tray/notify/autostart) with no non-Windows stubs.
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend test
        working-directory: frontend
        run: pnpm test

      - name: Frontend build
        working-directory: frontend
        run: pnpm build
